<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Movie Library</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>🎬 Personal Movie Library</h1>
    
    <div class="controls" style="display:flex; gap:8px; align-items:center;">
      <input type="text" id="libSearch" placeholder="Search library..." />
      
      <select id="sortType">
        <option value="added">Date Added</option>
        <option value="title">Name</option>
        <option value="releaseDate">Release Date</option>
        <option value="rating">TMDB Rating</option>
        <option value="myScore">My Rating</option>
      </select>
      
      <button id="sortDirBtn" class="secondary" data-dir="asc" title="Toggle Sort Order">⬆️</button>
      <button id="filterToggle" class="secondary">Filters</button>
    </div>

    <button id="addBtn">Add Movie</button>
  </header>

  <div id="filterPanel" class="filter-panel" style="display:none;">
    <div class="filter-row">
      <div class="filter-group">
        <label>Release Year:</label>
        <div class="year-inputs">
          <input type="number" id="yearStart" placeholder="From" min="1900" max="2099">
          <span>-</span>
          <input type="number" id="yearEnd" placeholder="To" min="1900" max="2099">
        </div>
      </div>
    </div>
    <div class="filter-group">
      <label>Genres:</label>
      <div id="genreList" class="genre-list">
        </div>
    </div>
  </div>

  <main class="container">
    <div id="library"></div>
  </main>

  <div id="overlay" class="overlay">
    <div class="modal">
      <header>
        <h2>Add Movie</h2>
        <button class="secondary" id="closeBtn">Close</button>
      </header>
      <div class="body">
        <div class="row">
          <input id="query" placeholder="Search…" />
          <select id="type">
            <option value="movie">Movie name</option>
            <option value="actor">Actor</option>
            <option value="director">Director</option>
            <option value="producer">Producer</option>
          </select>
          <button id="searchBtn">Search</button>
        </div>

        <div id="status" class="spinner"></div>
        <div id="results" class="results"></div>

        <button id="loadMoreBtn" class="secondary" style="display:none;margin-top:12px;">
          Load more
        </button>
      </div>
    </div>
  </div>

  <div id="detailsOverlay" class="overlay">
    <div class="modal">
      <header>
        <h2 id="detailsTitle"></h2>
        <button class="secondary" id="detailsClose">Close</button>
      </header>
      <div class="body" id="detailsBody"></div>
    </div>
  </div>

  <div id="reviewOverlay" class="overlay">
    <div class="modal">
      <header>
        <h2 id="reviewTitle">Personal Review</h2>
        <button class="secondary" id="reviewClose">Close</button>
      </header>
      <div class="body">
        <p class="muted" style="margin-top:0">Write your personal thoughts, review, or notes about this movie:</p>
        <textarea id="reviewInput" placeholder="I liked this movie because..."></textarea>
        <button id="saveReviewBtn" style="margin-top:12px; width:100%">Save Review</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
